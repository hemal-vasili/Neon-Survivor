<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Survivor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center, #101827, #05070c);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}

#gameContainer {
    position: relative;
}

canvas {
    display: block;

    width: 800px;
    height: 600px;

    max-width: 95vw;
    max-height: 90vh;

    background: #080d16;

    border: 2px solid #26364d;

    border-radius: 14px;

    box-shadow:
        0 0 30px rgba(0, 200, 255, 0.12);
}

/* HUD */

#hud {
    position: absolute;

    top: 15px;
    left: 18px;
    right: 18px;

    display: flex;
    justify-content: space-between;

    font-size: 18px;

    font-weight: bold;

    pointer-events: none;

    z-index: 5;
}

#xpContainer {
    position: absolute;

    top: 45px;
    left: 18px;
    right: 18px;

    height: 8px;

    background: #202938;

    border-radius: 20px;

    overflow: hidden;

    z-index: 5;
}

#xpBar {
    width: 0%;

    height: 100%;

    background: #4deaff;

    transition: width 0.15s;
}

/* Overlay */

#overlay {
    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    background: rgba(2, 5, 10, 0.92);

    border-radius: 14px;

    z-index: 20;
}

.panel {
    width: min(90%, 430px);

    padding: 30px;

    text-align: center;

    background: #111927;

    border: 1px solid #34445c;

    border-radius: 18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

.panel h1 {
    margin-top: 0;

    font-size: 36px;

    letter-spacing: 2px;
}

.panel p {
    color: #aeb9c9;

    line-height: 1.6;
}

button {
    border: none;

    border-radius: 10px;

    padding: 13px 25px;

    margin: 6px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background: #4deaff;

    color: #061018;

    transition:
        transform .15s,
        background .15s;
}

button:hover {
    transform: translateY(-2px);

    background: #8af1ff;
}

.upgrade {
    display: block;

    width: 100%;

    margin: 9px 0;

    text-align: left;

    background: #1b2637;

    color: white;

    border: 1px solid #3c4d66;
}

.upgrade:hover {
    background: #27374d;
}

.hidden {
    display: none !important;
}

</style>
</head>

<body>

<div id="gameContainer">

    <canvas
        id="game"
        width="800"
        height="600">
    </canvas>

    <div id="hud">

        <span id="score">
            Score: 0
        </span>

        <span id="level">
            Level 1
        </span>

    </div>

    <div id="xpContainer">

        <div id="xpBar"></div>

    </div>

    <div id="overlay">

        <div class="panel">

            <h1 id="title">
                NEON SURVIVOR
            </h1>

            <p id="message">
                Survive as long as possible.<br>
                Move with WASD or Arrow Keys.
            </p>

            <button id="startButton">
                START GAME
            </button>

            <div
                id="upgradeMenu"
                class="hidden">

                <h2>
                    LEVEL UP!
                </h2>

                <p>
                    Choose one upgrade.
                </p>

                <button
                    class="upgrade"
                    data-upgrade="speed">

                    ⚡ Increase Movement Speed

                </button>

                <button
                    class="upgrade"
                    data-upgrade="fire">

                    🔥 Increase Fire Rate

                </button>

                <button
                    class="upgrade"
                    data-upgrade="damage">

                    💥 Increase Bullet Damage

                </button>

                <button
                    class="upgrade"
                    data-upgrade="health">

                    ❤️ Increase Maximum Health

                </button>

            </div>

        </div>

    </div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   UI
========================================================= */

const scoreText =
    document.getElementById("score");

const levelText =
    document.getElementById("level");

const xpBar =
    document.getElementById("xpBar");

const overlay =
    document.getElementById("overlay");

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const startButton =
    document.getElementById("startButton");

const upgradeMenu =
    document.getElementById("upgradeMenu");


/* =========================================================
   GAME STATE
========================================================= */

let player;

let enemies = [];

let bullets = [];

let particles = [];

let keys = {};

let score = 0;

let xp = 0;

let level = 1;

let running = false;

let lastTime = 0;

let spawnTimer = 0;

let shootTimer = 0;


/* =========================================================
   PLAYER
========================================================= */

function createPlayer() {

    return {

        x: 400,

        y: 300,

        radius: 16,

        speed: 260,

        health: 120,

        maxHealth: 120,

        damage: 1,

        fireRate: 280
    };
}


/* =========================================================
   RESET
========================================================= */

function resetGame() {

    player =
        createPlayer();

    enemies = [];

    bullets = [];

    particles = [];

    score = 0;

    xp = 0;

    level = 1;

    spawnTimer = 0;

    shootTimer = 0;

    updateHUD();
}


/* =========================================================
   START
========================================================= */

function startGame() {

    resetGame();

    running = true;

    overlay.classList.add("hidden");

    lastTime =
        performance.now();

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = true;

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   SPAWN ENEMY
========================================================= */

function spawnEnemy() {

    let side =
        Math.floor(
            Math.random() * 4
        );

    let x;
    let y;

    if (side === 0) {

        x =
            Math.random() * 800;

        y = -40;

    }

    else if (side === 1) {

        x = 840;

        y =
            Math.random() * 600;

    }

    else if (side === 2) {

        x =
            Math.random() * 800;

        y = 640;

    }

    else {

        x = -40;

        y =
            Math.random() * 600;

    }


    /*
       Difficulty increases with score.
    */

    const difficulty =
        1 + score / 250;


    /*
       Random enemy types.
    */

    const type =
        Math.random();


    let enemy;


    /* FAST ENEMY */

    if (type < 0.25) {

        enemy = {

            x: x,

            y: y,

            radius: 11,

            speed:
                180 +
                difficulty * 20,

            health: 1,

            damage: 45,

            type: "fast"
        };

    }


    /* NORMAL ENEMY */

    else if (type < 0.85) {

        enemy = {

            x: x,

            y: y,

            radius: 15,

            speed:
                145 +
                difficulty * 18,

            health:
                1 +
                Math.floor(
                    difficulty / 4
                ),

            damage: 35,

            type: "normal"
        };

    }


    /* TANK ENEMY */

    else {

        enemy = {

            x: x,

            y: y,

            radius: 23,

            speed:
                90 +
                difficulty * 12,

            health:
                4 +
                Math.floor(
                    difficulty / 2
                ),

            damage: 60,

            type: "tank"
        };

    }


    enemies.push(enemy);
}


/* =========================================================
   SHOOT
========================================================= */

function shoot() {

    if (enemies.length === 0)
        return;


    let closest = null;

    let closestDistance =
        Infinity;


    for (const enemy of enemies) {

        const distance =
            Math.hypot(
                enemy.x - player.x,
                enemy.y - player.y
            );


        if (
            distance <
            closestDistance
        ) {

            closestDistance =
                distance;

            closest =
                enemy;
        }
    }


    if (!closest)
        return;


    const angle =
        Math.atan2(
            closest.y - player.y,
            closest.x - player.x
        );


    bullets.push({

        x: player.x,

        y: player.y,

        vx:
            Math.cos(angle) * 650,

        vy:
            Math.sin(angle) * 650,

        radius: 5,

        damage:
            player.damage
    });
}


/* =========================================================
   LEVEL SYSTEM
========================================================= */

function checkLevelUp() {

    const requiredXP =
        level * 100;


    if (xp >= requiredXP) {

        xp -= requiredXP;

        level++;

        running = false;

        showUpgrade();
    }
}


/* =========================================================
   UPGRADE MENU
========================================================= */

function showUpgrade() {

    overlay.classList.remove(
        "hidden"
    );

    title.textContent =
        "LEVEL UP!";

    message.textContent =
        "Choose your upgrade.";

    startButton.classList.add(
        "hidden"
    );

    upgradeMenu.classList.remove(
        "hidden"
    );
}


/* =========================================================
   UPGRADES
========================================================= */

document
.querySelectorAll(".upgrade")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            const type =
                button.dataset.upgrade;


            if (type === "speed") {

                player.speed *= 1.2;

            }


            if (type === "fire") {

                player.fireRate *= 0.8;

            }


            if (type === "damage") {

                player.damage += 1;

            }


            if (type === "health") {

                player.maxHealth += 25;

                player.health += 25;

            }


            upgradeMenu.classList.add(
                "hidden"
            );

            overlay.classList.add(
                "hidden"
            );

            running = true;

            lastTime =
                performance.now();

            requestAnimationFrame(
                gameLoop
            );

        }
    );

});


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(dt) {

    let dx = 0;

    let dy = 0;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        dy--;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        dy++;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        dx--;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        dx++;

    }


    if (dx !== 0 || dy !== 0) {

        const length =
            Math.hypot(
                dx,
                dy
            );


        dx /= length;

        dy /= length;


        player.x +=
            dx *
            player.speed *
            dt;


        player.y +=
            dy *
            player.speed *
            dt;

    }


    player.x =
        Math.max(
            player.radius,
            Math.min(
                800 - player.radius,
                player.x
            )
        );


    player.y =
        Math.max(
            player.radius,
            Math.min(
                600 - player.radius,
                player.y
            )
        );
}


/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies(dt) {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];


        const angle =
            Math.atan2(
                player.y - enemy.y,
                player.x - enemy.x
            );


        enemy.x +=
            Math.cos(angle) *
            enemy.speed *
            dt;


        enemy.y +=
            Math.sin(angle) *
            enemy.speed *
            dt;


        const distance =
            Math.hypot(
                player.x - enemy.x,
                player.y - enemy.y
            );


        if (
            distance <
            player.radius +
            enemy.radius
        ) {

            player.health -=
                enemy.damage *
                dt;


            /*
               Knock enemy slightly
               backwards to prevent
               instant stacking.
            */

            const pushX =
                enemy.x -
                player.x;

            const pushY =
                enemy.y -
                player.y;


            const pushLength =
                Math.hypot(
                    pushX,
                    pushY
                );


            if (pushLength > 0) {

                enemy.x +=
                    pushX /
                    pushLength *
                    25 *
                    dt;

                enemy.y +=
                    pushY /
                    pushLength *
                    25 *
                    dt;

            }


            if (
                player.health <= 0
            ) {

                gameOver();

                return;
            }
        }
    }
}


/* =========================================================
   UPDATE BULLETS
========================================================= */

function updateBullets(dt) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.vx *
            dt;


        bullet.y +=
            bullet.vy *
            dt;


        if (
            bullet.x < -20 ||
            bullet.x > 820 ||
            bullet.y < -20 ||
            bullet.y > 620
        ) {

            bullets.splice(i, 1);

            continue;
        }


        for (
            let j = enemies.length - 1;
            j >= 0;
            j--
        ) {

            const enemy =
                enemies[j];


            const distance =
                Math.hypot(
                    bullet.x - enemy.x,
                    bullet.y - enemy.y
                );


            if (
                distance <
                bullet.radius +
                enemy.radius
            ) {

                enemy.health -=
                    bullet.damage;


                bullets.splice(i, 1);


                if (
                    enemy.health <= 0
                ) {

                    enemies.splice(
                        j,
                        1
                    );


                    score +=
                        enemy.type === "tank"
                            ? 30
                            : enemy.type === "fast"
                                ? 15
                                : 10;


                    xp +=
                        enemy.type === "tank"
                            ? 30
                            : 15;


                    createExplosion(
                        enemy.x,
                        enemy.y
                    );


                    checkLevelUp();

                }


                break;
            }
        }
    }
}


/* =========================================================
   PARTICLES
========================================================= */

function createExplosion(
    x,
    y
) {

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            50 +
            Math.random() *
            120;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: .5

        });
    }
}


function updateParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];


        particle.x +=
            particle.vx *
            dt;


        particle.y +=
            particle.vy *
            dt;


        particle.life -=
            dt;


        if (
            particle.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }
    }
}


/* =========================================================
   SHOOT TIMER
========================================================= */

function updateShooting(dt) {

    shootTimer -=
        dt * 1000;


    if (
        shootTimer <= 0
    ) {

        shoot();

        shootTimer =
            player.fireRate;
    }
}


/* =========================================================
   SPAWNING
========================================================= */

function updateSpawning(dt) {

    spawnTimer -=
        dt * 1000;


    if (
        spawnTimer <= 0
    ) {

        spawnEnemy();


        /*
           Spawn faster as score rises.

           Starts around 750ms.
           Eventually becomes extremely fast.
        */

        spawnTimer =
            Math.max(
                180,
                750 -
                score * 1.2
            );
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    scoreText.textContent =
        "Score: " +
        score;


    levelText.textContent =
        "Level " +
        level;


    const requiredXP =
        level * 100;


    const percentage =
        Math.min(
            100,
            (xp / requiredXP) *
            100
        );


    xpBar.style.width =
        percentage + "%";
}


/* =========================================================
   DRAW GRID
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#080d16";


    ctx.fillRect(
        0,
        0,
        800,
        600
    );


    ctx.strokeStyle =
        "#111b2a";


    ctx.lineWidth = 1;


    for (
        let x = 0;
        x <= 800;
        x += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            600
        );

        ctx.stroke();
    }


    for (
        let y = 0;
        y <= 600;
        y += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            800,
            y
        );

        ctx.stroke();
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground();


    /* BULLETS */

    for (const bullet of bullets) {

        ctx.fillStyle =
            "#4deaff";


        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* ENEMIES */

    for (const enemy of enemies) {

        if (
            enemy.type === "fast"
        ) {

            ctx.fillStyle =
                "#ff3b6b";

        }

        else if (
            enemy.type === "tank"
        ) {

            ctx.fillStyle =
                "#a855f7";

        }

        else {

            ctx.fillStyle =
                "#ff6b4a";
        }


        ctx.beginPath();

        ctx.arc(
            enemy.x,
            enemy.y,
            enemy.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
           Enemy health indicator
        */

        if (
            enemy.health > 1
        ) {

            ctx.fillStyle =
                "#202938";


            ctx.fillRect(
                enemy.x - 15,
                enemy.y - enemy.radius - 10,
                30,
                4
            );


            ctx.fillStyle =
                "#ff5555";


            const healthWidth =
                Math.min(
                    30,
                    enemy.health * 5
                );


            ctx.fillRect(
                enemy.x - 15,
                enemy.y - enemy.radius - 10,
                healthWidth,
                4
            );
        }
    }


    /* PLAYER */

    ctx.fillStyle =
        "#4deaff";


    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Player health bar
    */

    ctx.fillStyle =
        "#202938";


    ctx.fillRect(
        player.x - 28,
        player.y - 34,
        56,
        6
    );


    ctx.fillStyle =
        "#4deaff";


    ctx.fillRect(
        player.x - 28,
        player.y - 34,
        56 *
        Math.max(
            0,
            player.health /
            player.maxHealth
        ),
        6
    );


    /* PARTICLES */

    for (const particle of particles) {

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life / .5
            );


        ctx.fillStyle =
            "#4deaff";


        ctx.fillRect(
            particle.x,
            particle.y,
            4,
            4
        );
    }


    ctx.globalAlpha = 1;
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    running = false;


    overlay.classList.remove(
        "hidden"
    );


    title.textContent =
        "GAME OVER";


    message.innerHTML =
        `
        Final Score:
        <strong>${score}</strong>
        <br><br>
        Reached Level:
        <strong>${level}</strong>
        `;


    startButton.textContent =
        "PLAY AGAIN";


    startButton.classList.remove(
        "hidden"
    );


    upgradeMenu.classList.add(
        "hidden"
    );
}


/* =========================================================
   MAIN LOOP
========================================================= */

function gameLoop(time) {

    if (!running)
        return;


    const dt =
        Math.min(
            0.033,
            (time - lastTime) /
            1000
        );


    lastTime = time;


    updatePlayer(dt);

    updateEnemies(dt);

    updateBullets(dt);

    updateParticles(dt);

    updateShooting(dt);

    updateSpawning(dt);

    updateHUD();

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   INITIALIZE
========================================================= */

resetGame();

</script>

</body>
</html>
