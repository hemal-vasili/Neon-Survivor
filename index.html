<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Survivor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050810;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#gameContainer {
    position: relative;
}

canvas {
    display: block;
    width: 800px;
    height: 600px;
    max-width: 95vw;
    max-height: 90vh;
    background: #080d16;
    border: 2px solid #26364d;
    border-radius: 14px;
}

#hud {
    position: absolute;
    top: 14px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: space-between;
    z-index: 5;
    pointer-events: none;
    font-weight: bold;
}

#difficulty {
    position: absolute;
    top: 70px;
    left: 18px;
    font-size: 13px;
    color: #aab5c7;
    z-index: 5;
}

#xpContainer {
    position: absolute;
    top: 44px;
    left: 18px;
    right: 18px;
    height: 7px;
    background: #202938;
    border-radius: 10px;
    overflow: hidden;
    z-index: 5;
}

#xpBar {
    height: 100%;
    width: 0%;
    background: #4deaff;
}

#overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(2, 5, 10, 0.93);
    border-radius: 14px;
    z-index: 20;
}

.panel {
    width: min(90%, 430px);
    padding: 30px;
    text-align: center;
    background: #111927;
    border: 1px solid #34445c;
    border-radius: 18px;
}

.panel h1 {
    margin-top: 0;
    font-size: 34px;
    letter-spacing: 2px;
}

.panel p {
    color: #adb8c9;
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 25px;
    margin: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #4deaff;
    color: #061018;
}

button:hover {
    background: #8af1ff;
}

.upgrade {
    display: block;
    width: 100%;
    margin: 9px 0;
    text-align: left;
    background: #1b2637;
    color: white;
    border: 1px solid #3c4d66;
}

.upgrade:hover {
    background: #27374d;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="gameContainer">

    <canvas id="game" width="800" height="600"></canvas>

    <div id="hud">
        <span id="score">Score: 0</span>
        <span id="level">Level 1</span>
    </div>

    <div id="xpContainer">
        <div id="xpBar"></div>
    </div>

    <div id="difficulty">
        Difficulty: Easy
    </div>

    <div id="overlay">

        <div class="panel">

            <h1 id="title">NEON SURVIVOR</h1>

            <p id="message">
                Survive the arena.<br>
                Move with WASD or Arrow Keys.
            </p>

            <button id="startButton">
                START GAME
            </button>

            <div id="upgradeMenu" class="hidden">

                <h2>LEVEL UP!</h2>

                <p>
                    Choose one upgrade.
                </p>

                <button class="upgrade" data-upgrade="speed">
                    ⚡ Movement Speed +15%
                </button>

                <button class="upgrade" data-upgrade="fire">
                    🔥 Fire Rate +15%
                </button>

                <button class="upgrade" data-upgrade="damage">
                    💥 Bullet Damage +1
                </button>

                <button class="upgrade" data-upgrade="health">
                    ❤️ Maximum Health +20
                </button>

            </div>

        </div>

    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const levelText = document.getElementById("level");
const xpBar = document.getElementById("xpBar");
const difficultyText = document.getElementById("difficulty");

const overlay = document.getElementById("overlay");
const title = document.getElementById("title");
const message = document.getElementById("message");

const startButton =
    document.getElementById("startButton");

const upgradeMenu =
    document.getElementById("upgradeMenu");

let player;
let enemies = [];
let bullets = [];
let particles = [];

let keys = {};

let score = 0;
let xp = 0;
let level = 1;

let running = false;

let lastTime = 0;

let spawnTimer = 0;
let shootTimer = 0;

let gameTime = 0;


/* =========================
   PLAYER
========================= */

function createPlayer() {

    return {
        x: 400,
        y: 300,

        radius: 16,

        speed: 245,

        health: 120,
        maxHealth: 120,

        damage: 1,

        fireRate: 320
    };
}


/* =========================
   RESET
========================= */

function resetGame() {

    player = createPlayer();

    enemies = [];
    bullets = [];
    particles = [];

    score = 0;
    xp = 0;
    level = 1;

    gameTime = 0;

    spawnTimer = 500;
    shootTimer = 0;

    updateHUD();
}


/* =========================
   START
========================= */

function startGame() {

    resetGame();

    running = true;

    overlay.classList.add("hidden");

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", event => {

    keys[event.key.toLowerCase()] = true;

});

document.addEventListener("keyup", event => {

    keys[event.key.toLowerCase()] = false;

});


/* =========================
   DIFFICULTY
========================= */

function getDifficulty() {

    /*
       Difficulty rises slowly.

       0 = beginning
       1 = after roughly 1 minute
       2 = after roughly 2 minutes
       etc.

       Capped at 5.
    */

    return Math.min(
        5,
        gameTime / 60
    );
}


function getDifficultyName() {

    const d = getDifficulty();

    if (d < 1)
        return "Easy";

    if (d < 2)
        return "Normal";

    if (d < 3)
        return "Hard";

    if (d < 4)
        return "Very Hard";

    return "INSANE";
}


/* =========================
   SPAWN ENEMY
========================= */

function spawnEnemy() {

    const side =
        Math.floor(Math.random() * 4);

    let x;
    let y;

    if (side === 0) {

        x = Math.random() * 800;
        y = -40;

    } else if (side === 1) {

        x = 840;
        y = Math.random() * 600;

    } else if (side === 2) {

        x = Math.random() * 800;
        y = 640;

    } else {

        x = -40;
        y = Math.random() * 600;
    }


    const difficulty =
        getDifficulty();


    const roll =
        Math.random();


    let enemy;


    /*
       FAST ENEMY
    */

    if (roll < 0.20) {

        enemy = {

            x,
            y,

            radius: 11,

            speed:
                105 +
                difficulty * 10,

            health: 1,

            damage: 28,

            type: "fast"
        };

    }


    /*
       NORMAL ENEMY
    */

    else if (roll < 0.90) {

        enemy = {

            x,
            y,

            radius: 15,

            speed:
                78 +
                difficulty * 9,

            health:
                1 +
                Math.floor(
                    difficulty / 2
                ),

            damage: 25,

            type: "normal"
        };

    }


    /*
       TANK
    */

    else {

        enemy = {

            x,
            y,

            radius: 23,

            speed:
                52 +
                difficulty * 6,

            health:
                4 +
                Math.floor(
                    difficulty
                ),

            damage: 38,

            type: "tank"
        };
    }


    enemies.push(enemy);
}


/* =========================
   SHOOT
========================= */

function shoot() {

    if (enemies.length === 0)
        return;


    let target = null;

    let nearest = Infinity;


    for (const enemy of enemies) {

        const distance =
            Math.hypot(
                enemy.x - player.x,
                enemy.y - player.y
            );


        if (distance < nearest) {

            nearest = distance;

            target = enemy;
        }
    }


    if (!target)
        return;


    const angle =
        Math.atan2(
            target.y - player.y,
            target.x - player.x
        );


    bullets.push({

        x: player.x,
        y: player.y,

        vx:
            Math.cos(angle) * 620,

        vy:
            Math.sin(angle) * 620,

        radius: 5,

        damage:
            player.damage
    });
}


/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(dt) {

    let dx = 0;
    let dy = 0;


    if (
        keys["w"] ||
        keys["arrowup"]
    )
        dy--;


    if (
        keys["s"] ||
        keys["arrowdown"]
    )
        dy++;


    if (
        keys["a"] ||
        keys["arrowleft"]
    )
        dx--;


    if (
        keys["d"] ||
        keys["arrowright"]
    )
        dx++;


    if (dx || dy) {

        const length =
            Math.hypot(dx, dy);

        dx /= length;
        dy /= length;


        player.x +=
            dx *
            player.speed *
            dt;


        player.y +=
            dy *
            player.speed *
            dt;
    }


    player.x =
        Math.max(
            player.radius,
            Math.min(
                800 - player.radius,
                player.x
            )
        );


    player.y =
        Math.max(
            player.radius,
            Math.min(
                600 - player.radius,
                player.y
            )
        );
}


/* =========================
   ENEMY UPDATE
========================= */

function updateEnemies(dt) {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];


        const angle =
            Math.atan2(
                player.y - enemy.y,
                player.x - enemy.x
            );


        enemy.x +=
            Math.cos(angle) *
            enemy.speed *
            dt;


        enemy.y +=
            Math.sin(angle) *
            enemy.speed *
            dt;


        const distance =
            Math.hypot(
                player.x - enemy.x,
                player.y - enemy.y
            );


        if (
            distance <
            player.radius +
            enemy.radius
        ) {

            /*
               Damage is continuous,
               but intentionally low.
            */

            player.health -=
                enemy.damage *
                dt;


            /*
               Push enemies slightly away
               from the player so they don't
               stack perfectly on top of each other.
            */

            const px =
                enemy.x - player.x;

            const py =
                enemy.y - player.y;

            const length =
                Math.hypot(px, py);


            if (length > 0) {

                enemy.x +=
                    (px / length) *
                    30 *
                    dt;

                enemy.y +=
                    (py / length) *
                    30 *
                    dt;
            }


            if (player.health <= 0) {

                gameOver();

                return;
            }
        }
    }
}


/* =========================
   BULLET UPDATE
========================= */

function updateBullets(dt) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet = bullets[i];


        bullet.x +=
            bullet.vx * dt;

        bullet.y +=
            bullet.vy * dt;


        if (
            bullet.x < -20 ||
            bullet.x > 820 ||
            bullet.y < -20 ||
            bullet.y > 620
        ) {

            bullets.splice(i, 1);

            continue;
        }


        for (
            let j = enemies.length - 1;
            j >= 0;
            j--
        ) {

            const enemy = enemies[j];


            const distance =
                Math.hypot(
                    bullet.x - enemy.x,
                    bullet.y - enemy.y
                );


            if (
                distance <
                bullet.radius +
                enemy.radius
            ) {

                enemy.health -=
                    bullet.damage;


                bullets.splice(i, 1);


                if (enemy.health <= 0) {

                    enemies.splice(j, 1);


                    if (
                        enemy.type === "tank"
                    ) {

                        score += 30;
                        xp += 30;

                    } else if (
                        enemy.type === "fast"
                    ) {

                        score += 15;
                        xp += 15;

                    } else {

                        score += 10;
                        xp += 10;
                    }


                    createExplosion(
                        enemy.x,
                        enemy.y
                    );


                    checkLevelUp();
                }


                break;
            }
        }
    }
}


/* =========================
   SPAWN CONTROL
========================= */

function updateSpawning(dt) {

    spawnTimer -=
        dt * 1000;


    if (spawnTimer <= 0) {

        spawnEnemy();


        const difficulty =
            getDifficulty();


        /*
           Starts around 1000ms.

           Eventually reaches 400ms.

           This prevents the impossible
           enemy swarm from the previous version.
        */

        spawnTimer =
            Math.max(
                400,
                1000 -
                difficulty * 100
            );
    }
}


/* =========================
   SHOOT CONTROL
========================= */

function updateShooting(dt) {

    shootTimer -=
        dt * 1000;


    if (shootTimer <= 0) {

        shoot();

        shootTimer =
            player.fireRate;
    }
}


/* =========================
   LEVEL UP
========================= */

function checkLevelUp() {

    const required =
        level * 100;


    if (xp >= required) {

        xp -= required;

        level++;

        running = false;

        showUpgrade();
    }
}


function showUpgrade() {

    overlay.classList.remove(
        "hidden"
    );

    title.textContent =
        "LEVEL UP!";

    message.textContent =
        "Choose an upgrade.";

    startButton.classList.add(
        "hidden"
    );

    upgradeMenu.classList.remove(
        "hidden"
    );
}


/* =========================
   UPGRADES
========================= */

document
.querySelectorAll(".upgrade")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const type =
                button.dataset.upgrade;


            if (type === "speed") {

                player.speed *= 1.15;
            }


            if (type === "fire") {

                player.fireRate *= 0.85;
            }


            if (type === "damage") {

                player.damage++;
            }


            if (type === "health") {

                player.maxHealth += 20;

                player.health += 20;
            }


            upgradeMenu.classList.add(
                "hidden"
            );

            overlay.classList.add(
                "hidden"
            );


            running = true;

            lastTime =
                performance.now();


            requestAnimationFrame(
                gameLoop
            );
        }
    );

});


/* =========================
   PARTICLES
========================= */

function createExplosion(x, y) {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            50 +
            Math.random() *
            80;


        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 0.4
        });
    }
}


function updateParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];


        particle.x +=
            particle.vx * dt;

        particle.y +=
            particle.vy * dt;

        particle.life -= dt;


        if (particle.life <= 0) {

            particles.splice(i, 1);
        }
    }
}


/* =========================
   HUD
========================= */

function updateHUD() {

    scoreText.textContent =
        "Score: " + score;


    levelText.textContent =
        "Level " + level;


    const required =
        level * 100;


    xpBar.style.width =
        Math.min(
            100,
            (xp / required) * 100
        ) + "%";


    difficultyText.textContent =
        "Difficulty: " +
        getDifficultyName();
}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    ctx.fillStyle =
        "#080d16";


    ctx.fillRect(
        0,
        0,
        800,
        600
    );


    ctx.strokeStyle =
        "#111a28";

    ctx.lineWidth = 1;


    for (
        let x = 0;
        x <= 800;
        x += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(x, 600);

        ctx.stroke();
    }


    for (
        let y = 0;
        y <= 600;
        y += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(800, y);

        ctx.stroke();
    }
}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();


    /* BULLETS */

    ctx.fillStyle =
        "#4deaff";


    for (const bullet of bullets) {

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* ENEMIES */

    for (const enemy of enemies) {

        if (
            enemy.type === "fast"
        ) {

            ctx.fillStyle =
                "#ff416c";

        } else if (
            enemy.type === "tank"
        ) {

            ctx.fillStyle =
                "#9b5cff";

        } else {

            ctx.fillStyle =
                "#ff704d";
        }


        ctx.beginPath();

        ctx.arc(
            enemy.x,
            enemy.y,
            enemy.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Health bar for tanks */

        if (
            enemy.health > 1
        ) {

            ctx.fillStyle =
                "#202938";


            ctx.fillRect(
                enemy.x - 15,
                enemy.y - enemy.radius - 9,
                30,
                4
            );


            ctx.fillStyle =
                "#ff5555";


            const healthWidth =
                Math.min(
                    30,
                    enemy.health * 5
                );


            ctx.fillRect(
                enemy.x - 15,
                enemy.y - enemy.radius - 9,
                healthWidth,
                4
            );
        }
    }


    /* PLAYER */

    ctx.fillStyle =
        "#4deaff";


    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* PLAYER HEALTH */

    ctx.fillStyle =
        "#202938";


    ctx.fillRect(
        player.x - 28,
        player.y - 34,
        56,
        6
    );


    ctx.fillStyle =
        "#4deaff";


    ctx.fillRect(
        player.x - 28,
        player.y - 34,
        56 *
        Math.max(
            0,
            player.health /
            player.maxHealth
        ),
        6
    );


    /* PARTICLES */

    for (const particle of particles) {

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life / 0.4
            );


        ctx.fillStyle =
            "#4deaff";


        ctx.fillRect(
            particle.x,
            particle.y,
            4,
            4
        );
    }


    ctx.globalAlpha = 1;
}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    running = false;


    overlay.classList.remove(
        "hidden"
    );


    title.textContent =
        "GAME OVER";


    message.innerHTML =
        `
        Score: <strong>${score}</strong>
        <br>
        Level: <strong>${level}</strong>
        <br>
        Difficulty: <strong>
        ${getDifficultyName()}
        </strong>
        `;


    startButton.textContent =
        "PLAY AGAIN";


    startButton.classList.remove(
        "hidden"
    );


    upgradeMenu.classList.add(
        "hidden"
    );
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

    if (!running)
        return;


    const dt =
        Math.min(
            0.033,
            (time - lastTime) / 1000
        );


    lastTime = time;

    gameTime += dt;


    updatePlayer(dt);

    updateEnemies(dt);

    updateBullets(dt);

    updateParticles(dt);

    updateShooting(dt);

    updateSpawning(dt);

    updateHUD();

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   BUTTON
========================= */

startButton.addEventListener(
    "click",
    startGame
);


/* =========================
   INITIALIZE
========================= */

resetGame();

</script>

</body>
</html>
